apiVersion: v1
kind: Namespace
metadata:
  name: zero-downtime-lab
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ha-app-pdb
  namespace: zero-downtime-lab
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: ha-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ha-app
  namespace: zero-downtime-lab
  labels:
    app: ha-app
spec:
  replicas: 4
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ha-app
  template:
    metadata:
      labels:
        app: ha-app
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - ha-app
              topologyKey: "kubernetes.io/hostname"
      terminationGracePeriodSeconds: 30
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
          name: http
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 2
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: "20m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ha-app-service
  namespace: zero-downtime-lab
spec:
  type: NodePort
  selector:
    app: ha-app
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30080
